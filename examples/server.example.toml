# gstarcad-mcp-server configuration example.
# Precedence: safe defaults < config file < environment variables
# (GSTARCAD_MCP_*) < CLI flags for non-secret operational settings.
# The MCP client cannot change permissions or workspace root through tools.

[server]
name = "gstarcad-mcp"
log_level = "INFO"
permission_profile = "authoring"

[cad]
prog_id = "GStarCAD.Application"
create_if_missing = true
visible = true
startup_wait_seconds = 20.0
shutdown_timeout_seconds = 10.0
max_queue_depth = 128
reconnect_attempts = 0
quit_launched_instance_on_exit = false

[workspace]
root = "%USERPROFILE%\\Documents\\GstarCAD-MCP"
allow_unc = false
allow_absolute_paths = false
allow_overwrite = false

[limits]
max_actions_per_batch = 500
max_total_vertices_per_batch = 100000
max_vertices_per_polyline = 10000
max_query_page_size = 1000
max_entity_handles_per_request = 1000
max_text_length = 20000
max_table_cells = 10000
max_screenshot_width = 4096
max_screenshot_height = 4096
max_resource_bytes = 67108864

[evidence]
require_screenshot_for_success = true
capture_bounds_by_default = false
hash_artifacts = true

[idempotency]
retention_days = 30
max_records = 100000

[logging]
file_enabled = true
max_file_bytes = 10485760
backup_count = 5
